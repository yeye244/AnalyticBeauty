<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>照片管理 - 美丽推荐平台后台管理系统</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar"></aside>
    <div class="main-wrapper">
      <header class="header"></header>
      <main class="content">
        <div class="page-header">
          <div class="page-heading">
            <h1 class="page-title">照片管理</h1>
            <p class="page-desc">统一管理用户上传的照片，为 AI 分析与个性化风格推荐提供数据支持。</p>
          </div>
          <div class="page-actions">
            <span class="page-summary" id="photoSummary">共 0 张照片</span>
            <button class="btn btn-primary" onclick="showAddModal()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
              新增照片
            </button>
          </div>
        </div>

        <!-- 搜索栏 -->
        <div class="search-bar">
          <div class="search-item">
            <label>用户ID：</label>
            <input type="text" class="form-input" id="searchUserId" placeholder="请输入用户ID">
          </div>
          <div class="search-item">
            <label>上传时间：</label>
            <input type="date" class="form-input" id="searchDate">
          </div>
          <div class="search-item">
            <label>状态：</label>
            <select class="form-select" id="searchStatus">
              <option value="">全部</option>
              <option value="已完成">已完成</option>
              <option value="分析中">分析中</option>
              <option value="分析失败">分析失败</option>
              <option value="未分析">未分析</option>
            </select>
          </div>
          <div class="search-actions">
            <button class="btn btn-primary" onclick="loadData(1)">查询</button>
            <button class="btn btn-default" onclick="resetSearch()">重置</button>
          </div>
        </div>

        <!-- 照片网格 -->
        <div class="photo-grid" id="photoGrid"></div>
        <div class="pagination pagination-standalone" id="pagination"></div>
      </main>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    let currentPage = 1;
    const pageSize = 12;
    let total = 0;
    let currentList = [];

    async function loadData(page = 1) {
      currentPage = page;
      const params = {
        page,
        pageSize,
        userId: document.getElementById('searchUserId').value,
        date: document.getElementById('searchDate').value,
        status: document.getElementById('searchStatus').value,
      };

      const res = await fetchGet('/photo/page', params);
      if (res.code === 0) {
        currentList = res.data.list || [];
        renderGrid(res.data.list || [], res.data.total || 0);
      } else {
        showToast(res.msg || '查询失败', 'error');
        renderGrid([], 0);
      }
    }

    // 分析状态 → 标签样式（状态值以数据库实际值为准）
    function statusTagClass(status) {
      switch (status) {
        case '已完成': return 'tag-success';
        case '分析中': return 'tag-warning';
        case '分析失败': return 'tag-danger';
        case '未分析': return 'tag-info';
        default: return 'tag-default';
      }
    }

    function renderGrid(list, totalCount) {
      total = totalCount;
      const grid = document.getElementById('photoGrid');
      const summary = document.getElementById('photoSummary');
      if (summary) summary.textContent = `共 ${total} 张照片`;

      if (!list.length) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">${icon('photo')}</div>
            <div class="empty-text">暂无照片数据</div>
          </div>`;
        renderPagination(document.getElementById('pagination'), total, currentPage, pageSize, loadData);
        return;
      }

      grid.innerHTML = list.map(row => `
        <article class="photo-card">
          <div class="photo-thumb">
            <span class="tag ${statusTagClass(row.Status)} photo-status">${escapeHTML(row.Status || '未知')}</span>
            <img src="${escapeHTML(row.ImageURL)}" alt="照片 ${row.PhotoID}" loading="lazy"
                 onerror="this.style.display='none';this.parentNode.querySelector('.photo-fallback').style.display='flex';">
            <div class="photo-fallback">${icon('photo')}<span>图片文件缺失</span></div>
          </div>
          <div class="photo-meta">
            <div class="photo-title">照片 #${row.PhotoID}</div>
            <div class="photo-sub">用户 #${row.UserID} · ${escapeHTML(row.UserName || '未关联')}</div>
            <div class="photo-time">${formatDate(row.UploadTime)}</div>
          </div>
          <div class="photo-actions">
            <button class="btn-link" onclick="showEditModal(${row.PhotoID})">修改</button>
            <button class="btn-link danger" onclick="deletePhoto(${row.PhotoID})">删除</button>
          </div>
        </article>
      `).join('');
      renderPagination(document.getElementById('pagination'), total, currentPage, pageSize, loadData);
    }

    function resetSearch() {
      document.getElementById('searchUserId').value = '';
      document.getElementById('searchDate').value = '';
      document.getElementById('searchStatus').value = '';
      loadData(1);
    }

    function showAddModal() {
      const bodyHTML = `
        <div class="form-group">
          <label>用户ID <span class="required">*</span></label>
          <input type="number" class="form-input" id="formUserId" placeholder="请输入用户ID">
        </div>
        <div class="form-group">
          <label>图片地址 <span class="required">*</span></label>
          <input type="text" class="form-input" id="formImageURL" placeholder="请输入图片地址或上传文件">
        </div>
        <div class="form-group">
          <label>状态</label>
          <select class="form-select" id="formStatus">
            <option value="已完成">已完成</option>
            <option value="分析中">分析中</option>
            <option value="分析失败">分析失败</option>
            <option value="未分析">未分析</option>
          </select>
        </div>
      `;
      showModal('新增照片', bodyHTML, `
        <button class="btn btn-default" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="submitAdd()">确定新增</button>
      `);
    }

    async function submitAdd() {
      const data = {
        UserID: document.getElementById('formUserId').value,
        ImageURL: document.getElementById('formImageURL').value,
        Status: document.getElementById('formStatus').value,
      };
      if (!data.UserID || !data.ImageURL) {
        showToast('请填写必填项', 'warning');
        return;
      }
      const res = await fetchPost('/photo/add', data);
      if (res.code === 0) {
        showToast('新增成功', 'success');
        closeModal();
        loadData(1);
      } else {
        showToast(res.msg || '操作失败', 'error');
      }
    }

    function showEditModal(id) {
      const row = currentList.find(r => r.PhotoID === id);
      if (!row) return;
      const bodyHTML = `
        <div class="form-group">
          <label>照片ID</label>
          <input type="text" class="form-input" value="${id}" disabled>
        </div>
        <div class="form-group">
          <label>用户</label>
          <input type="text" class="form-input" id="formUserName" value="${escapeHTML(row.UserName)}">
        </div>
        <div class="form-group">
          <label>图片地址 <span class="required">*</span></label>
          <input type="text" class="form-input" id="formImageURL" value="${escapeHTML(row.ImageURL)}">
        </div>
        <div class="form-group">
          <label>状态</label>
          <select class="form-select" id="formStatus">
            <option value="已完成" ${row.Status === '已完成' ? 'selected' : ''}>已完成</option>
            <option value="分析中" ${row.Status === '分析中' ? 'selected' : ''}>分析中</option>
            <option value="分析失败" ${row.Status === '分析失败' ? 'selected' : ''}>分析失败</option>
            <option value="未分析" ${row.Status === '未分析' ? 'selected' : ''}>未分析</option>
          </select>
        </div>
      `;
      showModal('修改照片信息', bodyHTML, `
        <button class="btn btn-default" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="submitEdit(${id})">保存修改</button>
      `);
    }

    async function submitEdit(id) {
      const data = {
        PhotoID: id,
        UserName: document.getElementById('formUserName').value,
        ImageURL: document.getElementById('formImageURL').value,
        Status: document.getElementById('formStatus').value,
      };
      if (!data.ImageURL) {
        showToast('图片地址不能为空', 'warning');
        return;
      }
      const res = await fetchPost('/photo/update', data);
      if (res.code === 0) {
        showToast('修改成功', 'success');
        closeModal();
        loadData(currentPage);
      } else {
        showToast(res.msg || '操作失败', 'error');
      }
    }

    function deletePhoto(id) {
      confirmDialog(`确定要删除照片ID为 ${id} 的记录吗？`, async () => {
        const res = await fetchPost('/photo/delete', { PhotoID: id });
        if (res.code === 0) {
          showToast('删除成功', 'success');
          loadData(currentPage);
        } else {
          showToast(res.msg || '操作失败', 'error');
        }
      });
    }

    initPage('photo', ['照片管理']);
    loadData(1);
  </script>
</body>
</html>
