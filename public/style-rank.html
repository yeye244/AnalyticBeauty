<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>风格匹配排行 - 美丽推荐平台后台管理系统</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar"></aside>
    <div class="main-wrapper">
      <header class="header"></header>
      <main class="content">
        <div class="page-header">
          <div class="page-heading">
            <h1 class="page-title">风格匹配排行</h1>
            <p class="page-desc">查看不同风格的匹配表现与排名分布。</p>
          </div>
        </div>

        <!-- 查询条件 -->
        <div class="search-bar">
          <div class="search-item">
            <label>时间范围：</label>
            <select class="form-select" id="searchRange">
              <option value="7">近7天</option>
              <option value="30">近30天</option>
              <option value="90">近3个月</option>
              <option value="">全部</option>
            </select>
          </div>
          <div class="search-item">
            <label>排序方式：</label>
            <select class="form-select" id="searchOrder">
              <option value="DESC">匹配次数 ↓</option>
              <option value="ASC">匹配次数 ↑</option>
            </select>
          </div>
          <div class="search-actions">
            <button class="btn btn-primary" onclick="loadData()">查询</button>
          </div>
        </div>

        <!-- 排行图表 -->
        <div class="chart-container">
          <div class="panel-title">风格匹配次数排行</div>
          <div class="panel-desc" id="rankDesc"></div>
          <div class="rank-board" id="rankChart"></div>
          <div class="panel-note" id="rankNote"></div>
        </div>

        <!-- 排名明细 -->
        <div class="table-wrapper">
          <table class="data-table rank-table">
            <thead>
              <tr>
                <th>排名</th>
                <th>风格名称</th>
                <th>匹配次数</th>
                <th>占比</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </main>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    async function loadData() {
      const order = document.getElementById('searchOrder').value;
      const params = {
        range: document.getElementById('searchRange').value,
        order,
      };
      // 图注与实际排序方式保持一致
      const note = document.getElementById('rankNote');
      if (note) note.textContent = `单位：次 · 条形长度与匹配次数成正比，按匹配次数从${order === 'ASC' ? '低到高' : '高到低'}排列`;

      const res = await fetchGet('/style/rank', params);
      if (res.code === 0) {
        renderChart(res.data || []);
        renderTable(res.data || []);
      } else {
        showToast(res.msg || '查询失败', 'error');
        renderChart([]);
        renderTable([]);
      }
    }

    // 排名徽标：仅前三名做克制强调（第一名品牌深莓果 + 香槟金细描边）
    function rankBadgeClass(index) {
      return index === 0 ? 'is-first' : index === 1 ? 'is-second' : index === 2 ? 'is-third' : '';
    }

    function renderChart(data) {
      const chart = document.getElementById('rankChart');
      const desc = document.getElementById('rankDesc');
      if (!data.length) {
        if (desc) desc.textContent = '';
        chart.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">${icon('chart')}</div>
            <div class="empty-text">暂无风格匹配数据</div>
          </div>`;
        return;
      }
      const maxVal = Math.max(...data.map(d => d.MatchCount), 1);
      const total = data.reduce((s, d) => s + d.MatchCount, 0);
      if (desc) desc.textContent = `共 ${data.length} 个风格 · 累计 ${total} 次匹配`;
      chart.innerHTML = data.map((d, i) => {
        const width = (d.MatchCount / maxVal * 100).toFixed(1);
        return `
          <div class="rank-row${i === 0 ? ' is-first' : ''}">
            <span class="rank-badge ${rankBadgeClass(i)}">${i + 1}</span>
            <span class="rank-name" title="${escapeHTML(d.StyleName)}">${escapeHTML(d.StyleName)}</span>
            <span class="rank-track"><span class="rank-fill" style="width:${width}%;"></span></span>
            <span class="rank-value">${d.MatchCount} 次</span>
          </div>
        `;
      }).join('');
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      if (!data.length) {
        tbody.innerHTML = emptyRow(4, '暂无风格匹配数据');
        return;
      }
      tbody.innerHTML = data.map((row, i) => `
        <tr>
          <td><span class="rank-badge ${rankBadgeClass(i)}">${i + 1}</span></td>
          <td class="text-bold">${escapeHTML(row.StyleName)}</td>
          <td>${row.MatchCount} 次</td>
          <td>
            <div class="pct-cell">
              <span class="pct-track"><span class="pct-fill" style="width:${row.Percentage}%;"></span></span>
              <span class="text-sm">${row.Percentage}%</span>
            </div>
          </td>
        </tr>
      `).join('');
    }

    initPage('style-rank', ['AI分析管理', '风格匹配排行']);
    loadData();
  </script>
</body>
</html>
