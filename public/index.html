<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工作台 - 美丽推荐平台后台管理系统</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar"></aside>
    <div class="main-wrapper">
      <header class="header"></header>
      <main class="content">
        <!-- 页面头部 -->
        <div class="page-header">
          <h1 class="page-title">工作台</h1>
          <span class="page-desc">平台数据总览与常用功能入口</span>
        </div>

        <!-- 统计数据（数值由接口实时获取） -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon" id="iconPhoto"></div>
            <div class="stat-info">
              <div class="stat-label">照片总数</div>
              <div class="stat-value" id="statPhoto">—</div>
              <div class="stat-caption">用户上传照片</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" id="iconAnalysis"></div>
            <div class="stat-info">
              <div class="stat-label">AI 分析记录</div>
              <div class="stat-value" id="statAnalysis">—</div>
              <div class="stat-caption">已生成分析结果</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" id="iconRecommend"></div>
            <div class="stat-info">
              <div class="stat-label">推荐记录</div>
              <div class="stat-value" id="statRecommend">—</div>
              <div class="stat-caption">风格推荐条数</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" id="iconSkincare"></div>
            <div class="stat-info">
              <div class="stat-label">护肤产品</div>
              <div class="stat-value" id="statSkincare">—</div>
              <div class="stat-caption">在库产品数</div>
            </div>
          </div>
        </div>

        <!-- 快捷入口 -->
        <div class="card">
          <div class="card-body">
            <div class="panel-title">快捷入口</div>
            <div class="quick-grid">
              <a class="quick-card" href="photo.html">
                <div class="quick-icon" data-icon="photo"></div>
                <div class="quick-title">照片管理</div>
              </a>
              <a class="quick-card" href="recommend.html">
                <div class="quick-icon" data-icon="bulb"></div>
                <div class="quick-title">推荐管理</div>
              </a>
              <a class="quick-card" href="skincare.html">
                <div class="quick-icon" data-icon="droplet"></div>
                <div class="quick-title">护肤品管理</div>
              </a>
              <a class="quick-card" href="analysis.html">
                <div class="quick-icon" data-icon="chart"></div>
                <div class="quick-title">分析查询</div>
              </a>
              <a class="quick-card" href="style.html">
                <div class="quick-icon" data-icon="palette"></div>
                <div class="quick-title">风格管理</div>
              </a>
              <a class="quick-card" href="admin.html">
                <div class="quick-icon" data-icon="shield"></div>
                <div class="quick-title">管理员管理</div>
              </a>
              <a class="quick-card" href="log.html">
                <div class="quick-icon" data-icon="log"></div>
                <div class="quick-title">日志统计</div>
              </a>
              <a class="quick-card" href="user.html">
                <div class="quick-icon" data-icon="user"></div>
                <div class="quick-title">用户管理</div>
              </a>
            </div>
          </div>
        </div>

        <!-- 风格匹配排行（数据来自 /style/rank） -->
        <div class="chart-container">
          <div class="panel-title-row">
            <div class="panel-title">风格匹配排行</div>
            <span class="chart-note">单位：次 · 按匹配记录数降序</span>
          </div>
          <div class="bar-chart" id="styleChart"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    initPage('dashboard', ['工作台']);
    renderStaticIcons();
    loadStats();
    loadStyleRank();

    // 渲染 SVG 图标（统计卡 + 快捷入口）
    function renderStaticIcons() {
      const statIcons = {
        iconPhoto: 'photo',
        iconAnalysis: 'chart',
        iconRecommend: 'bulb',
        iconSkincare: 'droplet'
      };
      Object.keys(statIcons).forEach(function (id) {
        const el = document.getElementById(id);
        if (el) el.innerHTML = icon(statIcons[id]);
      });
      document.querySelectorAll('.quick-icon[data-icon]').forEach(function (el) {
        el.innerHTML = icon(el.dataset.icon);
      });
    }

    // 统计数字：全部取自现有分页接口的 total 字段；取不到时显示「—」
    async function loadStats() {
      const [photo, analysis, recommend, skincare] = await Promise.all([
        fetchGet('/photo/page', { page: 1, pageSize: 1 }),
        fetchGet('/analysis/list', { page: 1, pageSize: 1 }),
        fetchGet('/recommend/page', { page: 1, pageSize: 1 }),
        fetchGet('/skincare/page', { page: 1, pageSize: 1 })
      ]);
      setStatTotal('statPhoto', photo);
      setStatTotal('statAnalysis', analysis);
      setStatTotal('statRecommend', recommend);
      setStatTotal('statSkincare', skincare);
    }

    function setStatTotal(id, res) {
      const el = document.getElementById(id);
      if (!el) return;
      const total = res && res.code === 0 && res.data ? res.data.total : null;
      el.textContent = (total === null || total === undefined) ? '—' : total;
    }

    // 风格匹配排行：使用 /style/rank 的真实 MatchCount
    async function loadStyleRank() {
      const chart = document.getElementById('styleChart');
      const res = await fetchGet('/style/rank', {});
      const data = (res.code === 0 && Array.isArray(res.data)) ? res.data : [];
      const rows = data.filter(function (d) { return d.MatchCount > 0; });

      if (!rows.length) {
        chart.innerHTML = '<div class="chart-empty">暂无风格匹配数据</div>';
        return;
      }

      const max = Math.max.apply(null, rows.map(function (d) { return d.MatchCount; }).concat([1]));
      chart.innerHTML = rows.map(function (d) {
        const height = Math.max(d.MatchCount / max * 100, 2).toFixed(0);
        return '<div class="bar-item" title="' + escapeHTML(d.StyleName) + '：' + d.MatchCount + ' 次">' +
                 '<div class="bar-value">' + d.MatchCount + '</div>' +
                 '<div class="bar" style="height:' + height + '%;"></div>' +
                 '<div class="bar-label">' + escapeHTML(d.StyleName) + '</div>' +
               '</div>';
      }).join('');
    }
  </script>
</body>
</html>
