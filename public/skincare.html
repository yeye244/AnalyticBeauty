<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>护肤产品管理 - 美丽推荐平台后台管理系统</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar"></aside>
    <div class="main-wrapper">
      <header class="header"></header>
      <main class="content">
        <div class="page-header">
          <div class="page-heading">
            <h1 class="page-title">产品信息管理</h1>
            <p class="page-desc">统一维护护肤产品资料、功效与适用肤质。</p>
          </div>
          <div class="page-actions">
            <span class="page-summary" id="productSummary">共 0 款产品</span>
            <button class="btn btn-primary" onclick="showAddModal()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
              新增产品
            </button>
            <a href="bundle-detail.html" class="btn btn-default">查看套装详情</a>
          </div>
        </div>

        <!-- 搜索栏（多条件查询） -->
        <div class="search-bar">
          <div class="search-item">
            <label>品牌：</label>
            <input type="text" class="form-input" id="searchBrand" placeholder="如：SK-II">
          </div>
          <div class="search-item price-range">
            <label>价格区间：</label>
            <input type="number" class="form-input" id="searchPriceMin" placeholder="最低">
            <span class="price-sep">—</span>
            <input type="number" class="form-input" id="searchPriceMax" placeholder="最高">
          </div>
          <div class="search-item">
            <label>适用肤质：</label>
            <select class="form-select" id="searchSkinType">
              <option value="">全部</option>
              <option value="干皮">干皮</option>
              <option value="油皮">油皮</option>
              <option value="混合皮">混合皮</option>
              <option value="敏感肌">敏感肌</option>
            </select>
          </div>
          <div class="search-item">
            <label>功效：</label>
            <select class="form-select" id="searchEffect">
              <option value="">全部</option>
              <option value="补水">补水</option>
              <option value="保湿">保湿</option>
              <option value="美白">美白</option>
              <option value="提亮">提亮</option>
              <option value="修护">修护</option>
              <option value="舒缓">舒缓</option>
              <option value="抗衰">抗衰</option>
              <option value="清洁">清洁</option>
              <option value="温和">温和</option>
              <option value="防晒">防晒</option>
            </select>
          </div>
          <div class="search-actions">
            <button class="btn btn-primary" onclick="loadData(1)">查询</button>
            <button class="btn btn-default" onclick="resetSearch()">重置</button>
          </div>
        </div>

        <!-- 表格 -->
        <div class="table-wrapper">
          <table class="data-table skincare-table">
            <thead>
              <tr>
                <th>产品ID</th>
                <th>产品名称</th>
                <th>品牌</th>
                <th>功效</th>
                <th>价格</th>
                <th>适用肤质</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
          <div class="pagination" id="pagination"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    let currentPage = 1;
    const pageSize = 10;
    let total = 0;
    let currentList = [];

    // 产品功效 / 适用肤质的真实取值（与数据库 skincareeffecttag、skincareskintype 实际存储值一致）
    const EFFECT_OPTIONS = ['补水', '保湿', '美白', '提亮', '修护', '舒缓', '抗衰', '清洁', '温和', '防晒'];
    const SKIN_TYPE_OPTIONS = ['干皮', '油皮', '混合皮', '敏感肌'];

    async function loadData(page = 1) {
      currentPage = page;
      const params = {
        page, pageSize,
        brand: document.getElementById('searchBrand').value,
        priceMin: document.getElementById('searchPriceMin').value,
        priceMax: document.getElementById('searchPriceMax').value,
        skinType: document.getElementById('searchSkinType').value,
        effect: document.getElementById('searchEffect').value,
      };
      const res = await fetchGet('/skincare/page', params);
      if (res.code === 0) {
        currentList = res.data.list || [];
        renderTable(res.data.list || [], res.data.total || 0);
      } else {
        showToast(res.msg || '查询失败', 'error');
        currentList = [];
        renderLoadError(res.msg || '数据加载失败，请稍后重试');
      }
    }

    // 是否处于筛选状态（用于区分「暂无数据」与「筛选无匹配」）
    function hasActiveFilter() {
      const ids = ['searchBrand', 'searchPriceMin', 'searchPriceMax', 'searchSkinType', 'searchEffect'];
      return ids.some(id => document.getElementById(id).value.trim() !== '');
    }

    // 逗号分隔的真实多值 → 独立标签
    function renderTagList(value, tagClass) {
      const items = String(value || '').split(',').map(v => v.trim()).filter(Boolean);
      if (!items.length) return '<span class="text-muted">-</span>';
      return `<span class="tag-list">${items.map(v => `<span class="tag ${tagClass}">${escapeHTML(v)}</span>`).join('')}</span>`;
    }

    function renderTable(list, totalCount) {
      total = totalCount;
      const summary = document.getElementById('productSummary');
      if (summary) summary.textContent = `共 ${total} 款产品`;
      const tbody = document.getElementById('tableBody');
      if (!list.length) {
        tbody.innerHTML = emptyRow(7, hasActiveFilter() ? '没有符合条件的产品' : '暂无产品数据');
        renderPagination(document.getElementById('pagination'), total, currentPage, pageSize, loadData);
        return;
      }
      tbody.innerHTML = list.map(row => `
        <tr>
          <td class="cell-id">${row.ProductID}</td>
          <td class="cell-name">${escapeHTML(row.ProductName)}</td>
          <td class="cell-brand">${escapeHTML(row.Brand)}</td>
          <td>${renderTagList(row.Effect, 'tag-primary')}</td>
          <td class="cell-price">¥${escapeHTML(row.Price)}</td>
          <td>${renderTagList(row.SkinType, 'tag-default')}</td>
          <td class="col-actions">
            <button class="btn-link" onclick="showEditModal(${row.ProductID})">修改</button>
            <button class="btn-link danger" onclick="deleteProduct(${row.ProductID})">删除</button>
          </td>
        </tr>
      `).join('');
      renderPagination(document.getElementById('pagination'), total, currentPage, pageSize, loadData);
    }

    // 加载失败：明确提示，不伪装成空数据
    function renderLoadError(msg) {
      total = 0;
      const summary = document.getElementById('productSummary');
      if (summary) summary.textContent = '—';
      document.getElementById('tableBody').innerHTML = emptyRow(7, msg);
      document.getElementById('pagination').innerHTML = '';
    }

    function resetSearch() {
      document.getElementById('searchBrand').value = '';
      document.getElementById('searchPriceMin').value = '';
      document.getElementById('searchPriceMax').value = '';
      document.getElementById('searchSkinType').value = '';
      document.getElementById('searchEffect').value = '';
      loadData(1);
    }

    function showAddModal() {
      const bodyHTML = `
        <div class="form-group">
          <label>产品名称 <span class="required">*</span></label>
          <input type="text" class="form-input" id="formName" placeholder="请输入产品名称">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>品牌 <span class="required">*</span></label>
            <input type="text" class="form-input" id="formBrand" placeholder="请输入品牌">
          </div>
          <div class="form-group">
            <label>价格 <span class="required">*</span></label>
            <input type="number" class="form-input" id="formPrice" placeholder="请输入价格">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>功效（多选）</label>
            <div class="checkbox-group">
              ${EFFECT_OPTIONS.map(e => `<label><input type="checkbox" name="effect" value="${e}"> ${e}</label>`).join('')}
            </div>
          </div>
          <div class="form-group">
            <label>适用肤质（多选）</label>
            <div class="checkbox-group">
              ${SKIN_TYPE_OPTIONS.map(s => `<label><input type="checkbox" name="skinType" value="${s}"> ${s}</label>`).join('')}
            </div>
          </div>
        </div>
      `;
      showModal('新增护肤产品', bodyHTML, `
        <button class="btn btn-default" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="submitAdd()">确定新增</button>
      `);
    }

    async function submitAdd() {
      const effects = Array.from(document.querySelectorAll('input[name="effect"]:checked')).map(cb => cb.value);
      const skinTypes = Array.from(document.querySelectorAll('input[name="skinType"]:checked')).map(cb => cb.value);
      const data = {
        ProductName: document.getElementById('formName').value,
        Brand: document.getElementById('formBrand').value,
        Price: document.getElementById('formPrice').value,
        Effects: effects,
        SkinTypes: skinTypes,
      };
      if (!data.ProductName || !data.Brand || !data.Price) {
        showToast('请填写必填项', 'warning');
        return;
      }
      const res = await fetchPost('/skincare/add', data);
      if (res.code === 0) {
        showToast('新增成功', 'success');
        closeModal();
        loadData(1);
      } else {
        showToast(res.msg || '操作失败', 'error');
      }
    }

    function showEditModal(id) {
      const row = currentList.find(r => r.ProductID === id);
      if (!row) return;
      const bodyHTML = `
        <div class="form-group">
          <label>产品ID</label>
          <input type="text" class="form-input" value="${id}" disabled>
        </div>
        <div class="form-group">
          <label>产品名称 <span class="required">*</span></label>
          <input type="text" class="form-input" id="formName" value="${escapeHTML(row.ProductName)}">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>品牌 <span class="required">*</span></label>
            <input type="text" class="form-input" id="formBrand" value="${escapeHTML(row.Brand)}">
          </div>
          <div class="form-group">
            <label>价格 <span class="required">*</span></label>
            <input type="number" class="form-input" id="formPrice" value="${row.Price}">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>功效（多选）</label>
            <div class="checkbox-group">
              ${EFFECT_OPTIONS.map(e => `<label><input type="checkbox" name="effect" value="${e}" ${(row.Effect || '').includes(e) ? 'checked' : ''}> ${e}</label>`).join('')}
            </div>
          </div>
          <div class="form-group">
            <label>适用肤质（多选）</label>
            <div class="checkbox-group">
              ${SKIN_TYPE_OPTIONS.map(s => `<label><input type="checkbox" name="skinType" value="${s}" ${(row.SkinType || '').includes(s) ? 'checked' : ''}> ${s}</label>`).join('')}
            </div>
          </div>
        </div>
      `;
      showModal('修改产品信息', bodyHTML, `
        <button class="btn btn-default" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="submitEdit(${id})">保存修改</button>
      `);
    }

    async function submitEdit(id) {
      const effects = Array.from(document.querySelectorAll('input[name="effect"]:checked')).map(cb => cb.value);
      const skinTypes = Array.from(document.querySelectorAll('input[name="skinType"]:checked')).map(cb => cb.value);
      const data = {
        ProductID: id,
        ProductName: document.getElementById('formName').value,
        Brand: document.getElementById('formBrand').value,
        Price: document.getElementById('formPrice').value,
        Effects: effects,
        SkinTypes: skinTypes,
      };
      if (!data.ProductName || !data.Brand || !data.Price) {
        showToast('请填写必填项', 'warning');
        return;
      }
      const res = await fetchPost('/skincare/update', data);
      if (res.code === 0) {
        showToast('修改成功', 'success');
        closeModal();
        loadData(currentPage);
      } else {
        showToast(res.msg || '操作失败', 'error');
      }
    }

    function deleteProduct(id) {
      confirmDialog(`确定要删除产品ID为 ${id} 的记录吗？`, async () => {
        const res = await fetchPost('/skincare/delete', { ProductID: id });
        if (res.code === 0) {
          showToast('删除成功', 'success');
          loadData(currentPage);
        } else {
          showToast(res.msg || '操作失败', 'error');
        }
      });
    }

    initPage('skincare', ['护肤品管理', '产品信息管理']);
    loadData(1);
  </script>
</body>
</html>
